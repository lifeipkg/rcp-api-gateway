server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    nacos:
      discovery:
        # 服务发现接线（rcp-contracts/docs/DISCOVERY.md）：占位符默认值命中部署侧
        # Service 名（compose 服务名与 K8s Service 名均为 nacos），部署侧无需注入。
        server-addr: ${NACOS_SERVER:nacos:8848}
        namespace: ${NACOS_NAMESPACE:risk-control}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

patrol:
  routes:
    # 巡查线服务发现注册名（主路径）：经 Nacos 按名解析实例，多实例轮转。
    # 注册名真源：rcp-ontology/ontology/abox/services.ttl 的 rcp:Service 个体。
    services:
      content: content-patrol
      message: message-patrol
      account: account-patrol
      fund: fund-patrol
    # 兜底地址：注册中心不可用或无实例时使用（本地开发无 compose 时即走这里）。
    # 过渡期部署侧可经 PATROL_ROUTES_ENDPOINTS_* 覆盖；discovery 接入完成后部署侧不再注入。
    endpoints:
      content: http://localhost:8081
      message: http://localhost:8082
      account: http://localhost:8083
      fund: http://localhost:8084

iam:
  auth:
    # 鉴权开关：关闭后网关不做鉴权，仅用于本地联调；生产必须为 true。
    enabled: ${IAM_AUTH_ENABLED:true}
    # 不需要令牌的路径。IAM 透传路径（/api/v1/iam/**）在过滤器里单独跳过。
    public-paths:
      - /actuator/**
      - /api/v1/patrol/domains
  routes:
    # 服务发现注册名（真源：abox/services.ttl 的 rcp:iam 个体）。
    service: iam
    # 兜底地址：注册中心不可用或无实例时使用。
    endpoint: ${IAM_ENDPOINT:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
